<h2>Reset your password</h2>

<p>
  We received a request to reset your byteyourjob password. Follow the link
  below to choose a new one.
</p>

<!-- Our /auth/confirm route verifies the token, signs the user in and sends recovery links
     to the "set a new password" page. The destination is decided there, by type, never by
     a URL parameter. -->
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
    >Reset password</a
  >
</p>

<p>If you didn't ask to reset your password, you can ignore this email.</p>
