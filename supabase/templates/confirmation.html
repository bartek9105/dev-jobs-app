<h2>Confirm your email</h2>

<p>
  Thanks for signing up for byteyourjob. Follow the link below to confirm your
  email address.
</p>

<!-- Links to our own route, which verifies the token on the server. Unlike the default
     link, it works even when opened on another device than the one used to sign up. -->
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
    >Confirm email address</a
  >
</p>

<p>If you didn't sign up, you can ignore this email.</p>
